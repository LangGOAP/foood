# Out-of-stock cases against the seeded menus (foood/seed.py), with the dishes a reasonable
# person would accept in place of the missing one. Written by hand; the suggest model is
# scored on whether its first grounded suggestion is one of them. Kitchens within reach of
# the door at 742 Evergreen Terrace (downtown) are the pool; items must be on an open menu.
# Every case is answerable: at least one acceptable dish is in the pool (a test checks this).

[[case]]
kitchen = "QA Kitchen"
ordered = ["QA Pasta"]
missing = "QA Pasta"
acceptable = ["QA Pasta", "Spaghetti Carbonara", "Penne Arrabbiata"]

[[case]]
kitchen = "QA Kitchen"
ordered = ["QA Burger"]
missing = "QA Burger"
acceptable = ["QA Burger", "Classic Burger", "Double Smash", "Mushroom Swiss"]

