[project]
name = "foood"
version = "0.1.0"
description = "A food-delivery platform you can break on purpose."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "openai>=3.55.1",
    "langgraph>=1.2.24",
    "langchain-openai>=1.8.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgoap>=0.3.3",
]

[project.scripts]
foood = "foood.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "httpx>=0.27",
    "ruff>=0.9",
    "black>=24.8",
    "mypy>=1.11",
    "jsonschema>=4.23",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foood"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -q"
timeout = 60  # a hung stream must fail, not stall CI

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
