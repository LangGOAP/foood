# Money misbehaves: a declined card, a double-submitted order and a gateway outage.
name = "payment-trouble"
description = "Order 1's card is declined; order 2 is submitted twice; order 3 meets a minute of payment gateway outage."
seed = 4

[kitchen]
autopilot = true

[[inject]]
order = 1
failure = "payment_declines"
times = 1  # 2 declines the backup card too
reason = "Insufficient funds"

[[inject]]
order = 2
failure = "duplicate_submission"

[[inject]]
order = 3
failure = "gateway_down"
for_seconds = 60
