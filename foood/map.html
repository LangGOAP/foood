<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>foood · the evening</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --ink:#1b1b1f; --muted:#6b6b76; --line:#e6e4df; --paper:#faf8f4; --card:#fff; --red:#c8102e; --amber:#b35c00; --blue:#1f5fbf; --green:#1d7a46; --grey:#9a9aa3; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--paper); display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:12px; background:var(--card); }
  header h1 { font-size:18px; margin:0; } header small, #counts { color:var(--muted); }
  #map { flex:1; min-height:320px; }
  .legend { position:absolute; right:12px; top:64px; z-index:500; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:12px; color:var(--muted); }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .label { background:transparent; border:0; box-shadow:none; font-size:11px; color:var(--ink); font-weight:600; text-shadow:0 0 3px #fff, 0 0 3px #fff; }
  .label::before { display:none; }
  #log { height:112px; margin:0; padding:8px 16px; border-top:1px solid var(--line); background:var(--card); font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; white-space:pre-wrap; color:var(--muted); overflow:hidden; }
</style>
</head>
<body>
<header>
  <h1>foood <small>· the evening on one map · engine <span id="engine">…</span><span id="scenario"></span></small></h1>
  <div id="counts">loading…</div>
</header>
<div id="map"></div>
<div class="legend">
  <div><span style="background:var(--grey)"></span>placed</div>
  <div><span style="background:var(--amber)"></span>in the kitchen</div>
  <div><span style="background:var(--blue)"></span>on the road</div>
  <div><span style="background:var(--green)"></span>delivered</div>
  <div><span style="background:var(--red)"></span>cancelled</div>
</div>
<pre id="log"></pre>
<script>
  const COLORS = {
    CREATED: "var(--grey)", PAYMENT_PENDING: "var(--grey)",
    CONFIRMED: "var(--amber)", PREPARING: "var(--amber)", READY_FOR_PICKUP: "var(--amber)",
    DRIVER_ASSIGNED: "var(--blue)", PICKED_UP: "var(--blue)",
    DELIVERED: "var(--green)", CANCELLED: "var(--red)", FAILED: "var(--red)",
  };
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v.slice(4, -1)).trim() || v;
  const short = (id) => id.slice(0, 8);
  const words = (s) => s.toLowerCase().replace(/_/g, " ");
  const map = L.map("map", { zoomControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  let fitted = false, followed = false;
  const kitchens = new Map(), doors = new Map(), lines = new Map(), drivers = new Map();
  const LABEL_ZOOM = 14;  // closer than this, neighbouring kitchens' names would overlap
  function labelKitchens() {
    const show = map.getZoom() >= LABEL_ZOOM;
    for (const m of kitchens.values()) { const t = m.getTooltip(); if (!t) continue; if (show !== t.options.permanent) { m.unbindTooltip(); m.bindTooltip(t.getContent(), { permanent: show, direction: "right", className: "label", offset: [8, 0] }); } }
  }
  map.on("zoomend", labelKitchens);

  function render(d) {
    for (const k of d.kitchens) {
      if (kitchens.has(k.id)) continue;
      kitchens.set(k.id, L.circleMarker([k.latitude, k.longitude], {
        radius: 7, color: css("var(--ink)"), weight: 2, fillColor: k.status === "OPEN" ? "#fff" : css("var(--line)"), fillOpacity: 1,
      }).bindTooltip(k.name, { permanent: map.getZoom() >= LABEL_ZOOM, direction: "right", className: "label", offset: [8, 0] }).addTo(map));
    }
    if (!fitted && d.kitchens.length) { map.fitBounds(d.kitchens.map((k) => [k.latitude, k.longitude]), { padding: [40, 40] }); fitted = true; labelKitchens(); }
    // once the evening starts, follow the orders and the drivers rather than the whole city
    const busy = [...d.orders.filter((o) => o.latitude != null).flatMap((o) => { const k = d.kitchens.find((x) => x.id === o.restaurantId); return k ? [[k.latitude, k.longitude], [o.latitude, o.longitude]] : []; }),
                  ...d.drivers.filter((v) => v.latitude != null).map((v) => [v.latitude, v.longitude])];
    if (!followed && busy.length) { map.fitBounds(busy, { padding: [60, 60], maxZoom: 15 }); followed = true; labelKitchens(); }
    for (const o of d.orders) {
      if (o.latitude == null) continue;
      const k = d.kitchens.find((x) => x.id === o.restaurantId);
      if (!k) continue;
      const color = css(COLORS[o.status] || "var(--grey)");
      const pts = [[k.latitude, k.longitude], [o.latitude, o.longitude]];
      const dash = o.status === "DELIVERED" ? null : "6 6";
      const tip = `order ${short(o.id)} · ${words(o.status)}`;
      if (!lines.has(o.id)) {
        lines.set(o.id, L.polyline(pts, { color, weight: 3, opacity: 0.85, dashArray: dash }).addTo(map));
        doors.set(o.id, L.circleMarker(pts[1], { radius: 5, color, fillColor: color, fillOpacity: 1 }).bindTooltip(tip).addTo(map));
      } else {
        lines.get(o.id).setStyle({ color, dashArray: dash }); lines.get(o.id).setLatLngs(pts);
        doors.get(o.id).setStyle({ color, fillColor: color }); doors.get(o.id).setTooltipContent(tip);
      }
    }
    const seen = new Set();
    for (const v of d.drivers) {
      if (v.latitude == null) continue;
      seen.add(v.id);
      const label = v.orderId ? `${v.plate} · order ${short(v.orderId)}` : v.plate;
      if (!drivers.has(v.id)) {
        drivers.set(v.id, L.circleMarker([v.latitude, v.longitude], { radius: 6, color: "#fff", weight: 2, fillColor: css("var(--blue)"), fillOpacity: 1 })
          .bindTooltip(label, { permanent: true, direction: "bottom", className: "label", offset: [0, 6] }).addTo(map));
      } else { drivers.get(v.id).setLatLng([v.latitude, v.longitude]); drivers.get(v.id).setTooltipContent(label); }
    }
    for (const [id, m] of drivers) if (!seen.has(id)) { map.removeLayer(m); drivers.delete(id); }
    const delivered = d.orders.filter((o) => o.status === "DELIVERED").length;
    const cancelled = d.orders.filter((o) => o.status === "CANCELLED" || o.status === "FAILED").length;
    document.getElementById("engine").textContent = d.engine;
    document.getElementById("scenario").textContent = d.scenario ? ` · scenario ${d.scenario}` : "";
    document.getElementById("counts").textContent =
      `${d.orders.length} orders · ${delivered} delivered · ${cancelled} cancelled · ${d.drivers.filter((v) => v.latitude != null).length} drivers on the map`;
  }
  async function tick() {
    try { render(await (await fetch("/api/_map")).json()); } catch (e) { document.getElementById("counts").textContent = "the API is not answering"; }
  }
  async function log() {
    try {
      const s = await (await fetch("/api/_scenario")).json();
      const when = (at) => { const d = new Date(at || ""); return Number.isNaN(d.getTime()) ? "" : d.toLocaleTimeString([], { hour12: false }); };
      const lines = (s.log || []).slice(-6).map((e) =>
        `${when(e.at)}  ${e.event || ""}${e.orderId ? `  order ${short(e.orderId)}` : ""}${e.reason ? `  ${e.reason}` : ""}`);
      document.getElementById("log").textContent = lines.join("\n") || (s.name ? `scenario ${s.name}: nothing fired yet` : "no scenario loaded");
    } catch (e) { /* the log is a nicety */ }
  }
  setInterval(() => { tick(); log(); }, 2000);
  tick(); log();
</script>
</body>
</html>
