<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>foood support</title>
<style>
  :root { --ink:#1b1b1f; --muted:#6b6b76; --line:#e6e4df; --paper:#faf8f4; --card:#fff; --red:#c8102e; --amber:#b35c00; --green:#1f7a3a; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--paper); }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  header h1 { font-size:18px; margin:0; } header small { color:var(--muted); }
  main { max-width:720px; margin:0 auto; padding:12px 16px 48px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .q { border-left:4px solid var(--amber); }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; background:#f1efe9; }
  .pill.bad { background:#fde8ea; color:var(--red); } .pill.ok { background:#e6f4ea; color:var(--green); }
  button { font:inherit; border:1px solid var(--ink); background:var(--ink); color:#fff; border-radius:8px; padding:8px 12px; margin:6px 6px 0 0; cursor:pointer; }
  button.alt { background:#fff; color:var(--ink); }
  input { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; width:100%; margin-top:6px; }
  ul.decisions { margin:6px 0 0; padding-left:18px; font-size:13px; } ul.decisions li { margin:2px 0; }
  .plan { margin:8px 0 4px; display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .step { font-size:12px; padding:3px 8px; border-radius:6px; background:#f1efe9; border:1px solid var(--line); }
  .step.done { opacity:.55; text-decoration:line-through; }
  .step.now { background:var(--ink); color:#fff; border-color:var(--ink); }
  .plan-note { font-size:12px; color:var(--muted); margin:2px 0; }
  form#login { max-width:360px; margin:40px auto; }
  .empty { color:var(--muted); font-style:italic; }
  .log { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; white-space:pre-wrap; color:var(--muted); }
</style>
</head>
<body>
<header><h1>foood support</h1><small id="meta"></small></header>
<main>
  <form id="login" class="card">
    <h2>Sign in as support</h2>
    <input id="email" type="email" placeholder="admin@example.com" value="admin@example.com">
    <input id="password" type="password" placeholder="password">
    <button type="submit">Sign in</button>
    <div id="login-error" class="muted"></div>
  </form>
  <section id="board" hidden>
    <h2>Open questions</h2><div id="questions"></div>
    <h2>Recent orders</h2><div id="orders"></div>
    <h2>Scenario</h2><div id="scenario" class="card log"></div>
  </section>
</main>
<script>
const API = location.origin;
let token = null, timer = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const dollars = (x) => (Number(x) < 0 ? "-" : "") + "$" + Math.abs(Number(x)).toFixed(2);
const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "";

$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch(`${API}/api/auth/login`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({email: $("email").value, password: $("password").value})});
  if (!r.ok) { $("login-error").textContent = "Sign in failed"; return; }
  const body = await r.json();
  if (body.role !== "ADMIN") { $("login-error").textContent = "That account is not support"; return; }
  token = body.accessToken; $("login").hidden = true; $("board").hidden = false;
  await refresh(); timer = setInterval(refresh, 3000);
});

async function api(path, init = {}) {
  const r = await fetch(`${API}${path}`, {...init, headers: {"Content-Type":"application/json", Authorization: `Bearer ${token}`, ...(init.headers||{})}});
  if (r.status === 401) { clearInterval(timer); token = null; $("board").hidden = true; $("login").hidden = false; throw new Error("signed out"); }
  return r;
}

async function refresh() {
  const data = await (await api("/api/support/overview")).json();
  $("meta").textContent = `engine ${data.engine}${data.scenario ? ` · scenario ${data.scenario.name}` : ""} · ${fmtTime(data.now)}`;
  renderQuestions(data.openQuestions); renderOrders(data.orders); renderScenario(data.scenario);
}

function renderQuestions(qs) {
  const el = $("questions");
  if (!qs.length) { el.innerHTML = '<div class="empty">Nothing waiting on a person.</div>'; return; }
  el.innerHTML = qs.map((q) => `
    <div class="card q" data-id="${q.id}">
      <div class="row"><strong>${esc(q.kind)}</strong><span class="muted">order ${esc(q.orderId.slice(0,8))} · by ${fmtTime(q.deadline)}</span></div>
      <div>${esc(q.prompt)}</div>
      ${q.options ? q.options.map((o) => `<button data-value="${esc(o.value)}" class="${o.value === q.default ? "" : "alt"}">${esc(o.label)}</button>`).join("") : ""}
      ${q.form ? renderForm(q) : ""}
    </div>`).join("");
  el.querySelectorAll("button[data-value]").forEach((b) => b.addEventListener("click", () => answer(b.closest(".q").dataset.id, b.dataset.value)));
  el.querySelectorAll("form.typed").forEach((f) => f.addEventListener("submit", (e) => { e.preventDefault(); answer(f.closest(".q").dataset.id, formValue(f, JSON.parse(f.dataset.schema))); }));
}

function renderForm(q) {
  const props = q.form.properties || {};
  const fields = Object.entries(props).map(([name, spec]) =>
    `<label class="muted">${esc(spec.title || name)}<input name="${esc(name)}" type="${spec.type === "number" || spec.type === "integer" ? "number" : "text"}" ${spec.type === "number" ? 'step="any"' : ""} placeholder="${esc(spec.description || "")}"></label>`).join("");
  return `<form class="typed" data-schema='${esc(JSON.stringify(q.form))}'>${fields}<button type="submit">Send</button></form>`;
}

function formValue(form, schema) {
  const out = {};
  for (const [name, spec] of Object.entries(schema.properties || {})) {
    const raw = form.elements[name].value;
    if (raw === "") continue;
    out[name] = spec.type === "number" || spec.type === "integer" ? Number(raw) : spec.type === "boolean" ? raw === "true" : raw;
  }
  return out;
}

async function answer(id, value) {
  const r = await api(`/api/support/questions/${id}/answer`, {method:"POST", body: JSON.stringify({value})});
  if (!r.ok) { const b = await r.json(); alert(b.message || "Refused"); return; }
  await refresh();
}

function renderOrders(orders) {
  const el = $("orders");
  if (!orders.length) { el.innerHTML = '<div class="empty">No orders yet.</div>'; return; }
  el.innerHTML = orders.map((o) => `
    <div class="card">
      <div class="row"><strong>${esc(o.restaurantName)} · ${esc(o.customerFirstName || "")}</strong>
        <span class="pill ${o.status === "CANCELLED" || o.status === "FAILED" ? "bad" : o.status === "DELIVERED" ? "ok" : ""}">${esc(o.status)}</span></div>
      <div class="muted">${esc(o.id.slice(0,8))} · ${esc(o.items.map((i) => `${i.quantity}× ${i.name}`).join(", "))} · $${esc(o.totalAmount)} · promised ${fmtTime(o.promisedAt)}${o.promiseBreached ? ' · <span class="pill bad">late</span>' : ""}${o.cancellationNote ? ` · ${esc(o.cancellationNote)}` : ""}</div>
      ${renderPlan(o.plan)}
      ${o.decisions.length ? `<ul class="decisions">${o.decisions.map((d) => `<li>${fmtTime(d.at)} <strong>${esc(d.decision)}</strong> — ${esc(d.because || "")}${d.licensePlate ? ` (${esc(d.licensePlate)})` : ""}${d.steps ? ` [${esc(d.steps.join(" → "))}]` : ""}</li>`).join("")}</ul>` : ""}
    </div>`).join("");
}

function renderPlan(plan) {
  if (!plan) return "";
  const steps = plan.steps.map((s, i) => {
    const cls = plan.position === null ? "step" : i < plan.position ? "step done" : i === plan.position ? "step now" : "step";
    return `<span class="${cls}">${esc(s.replace(/_/g, " "))}</span>`;
  }).join('<span class="muted">›</span>');
  const notes = [];
  if (plan.cost != null) notes.push(`cost ${plan.cost}`);
  if (plan.replans) notes.push(`${plan.replans} re-plan${plan.replans > 1 ? "s" : ""}${plan.lastReplan ? `, last: ${esc(plan.lastReplan)}` : ""}`);
  if (plan.considered && plan.considered.length) notes.push("considered " + plan.considered.map((c) => `${esc(c.kitchen)} (${dollars(c.difference)}${c.needsApproval ? ", needs approval" : ""})`).join(", "));
  if (plan.lastReasoning) notes.push(`model: ${esc(plan.lastReasoning)}`);
  return `<div class="plan">${steps}</div>${notes.map((n) => `<div class="plan-note">${n}</div>`).join("")}`;
}

function renderScenario(s) {
  $("scenario").textContent = s ? [`${s.name}: ${s.description}`, ...s.log.map((e) => `${fmtTime(e.at)} ${e.event}${e.failure ? " " + e.failure : ""}${e.orderId ? " order " + e.orderId.slice(0,8) : ""}`)].join("\n") : "No scenario loaded.";
}
</script>
</body>
</html>
